<!--
  Superintelligence SG shared footer block (v1, 2026-10-28).
  Self-contained: no external fonts, images or scripts. Identical on .si, .com, .org and .ai;
  only aria-current="page" differs, and scripts/si-ecosystem.py sets it per site.
  Disclosure wording is copied verbatim from https://superintelligencesg.org/about.html (master).
  Do not edit the injected copies in the pages; edit this file and re-run the script.
-->
<!-- si-eco:css -->
<style id="si-eco-css">
.si-eco-bar,.si-eco-foot{--si-eco-bg:#0b1411;--si-eco-fg:#c9d4cf;--si-eco-hi:#fff;--si-eco-line:rgba(201,212,207,.22);box-sizing:border-box;width:100%;margin:0;background:var(--si-eco-bg);color:var(--si-eco-fg);font:500 12px/1.45 "Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;letter-spacing:.01em;text-align:left}
.si-eco-bar *,.si-eco-foot *{box-sizing:border-box}
.si-eco-in{max-width:1160px;margin:0 auto;padding:0 clamp(15px,4vw,24px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 20px}
.si-eco-tag{margin:0;font:600 10.5px/1.3 "SFMono-Regular",Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--si-eco-fg)}
.si-eco-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;min-width:0}
.si-eco-list li{margin:0;padding:0;display:flex;align-items:center}
.si-eco-list li+li:before{content:"\00b7";padding:0 7px;opacity:.6}
.si-eco-list a{display:inline-flex;align-items:center;min-height:34px;padding:0 1px;border-bottom:2px solid transparent;color:var(--si-eco-fg);font-weight:600;text-decoration:none;white-space:nowrap}
.si-eco-list a span{margin-left:2px;font:500 10.5px/1 "SFMono-Regular",Consolas,monospace;opacity:.8}
.si-eco-list a:hover{color:var(--si-eco-hi);border-bottom-color:var(--si-eco-line)}
.si-eco-list a[aria-current=page]{color:var(--si-eco-hi);border-bottom-color:var(--si-eco-hi)}
.si-eco-bar a:focus-visible,.si-eco-foot a:focus-visible{outline:2px solid var(--si-eco-hi);outline-offset:2px}
.si-eco-foot{border-top:1px solid var(--si-eco-line);padding:26px 0 30px}
.si-eco-foot .si-eco-in{flex-direction:column;align-items:flex-start;gap:10px}
.si-eco-disc{margin:6px 0 0;max-width:80ch;font-size:13px;line-height:1.6}
.si-eco-disc a{color:var(--si-eco-hi);text-decoration:underline;text-underline-offset:2px}
@media (max-width:360px){.si-eco-list a span{display:none}}
</style>
<!-- /si-eco:css -->
<!-- si-eco:foot -->
<section class="si-eco-foot" aria-label="Superintelligence SG sites and disclosure"><div class="si-eco-in"><p class="si-eco-tag">Superintelligence SG · Singapore's open SI ecosystem</p><p class="si-eco-disc">Disclosure: Superintelligence SG is founded by Jerry Tuo, who also founded JT M&amp;C Pte Ltd (JT SG AI) and co-founded Red Fun Planet. Listings affiliated with our founder get no special ranking. <a href="https://superintelligencesg.org/about.html#disclosure">Disclosure on the Commons About page</a></p></div></section>
<!-- /si-eco:foot -->
